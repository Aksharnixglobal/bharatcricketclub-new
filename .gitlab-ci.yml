image: node:20-alpine

stages:
  - build
  - deploy

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - node_modules/

before_script:
  - npm ci --cache .npm --prefer-offline

build:
  stage: build
  script:
    - npm run build
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    paths:
      - dist/
    expire_in: 1 week

deploy:
  stage: deploy
  only:
    - main
  dependencies:
    - build
  before_script: [] # Skip npm ci in deploy stage to speed up execution
  script:
    # Uses Firebase CLI via npx. Requires either FIREBASE_TOKEN or 
    # GOOGLE_APPLICATION_CREDENTIALS / FIREBASE_SERVICE_ACCOUNT configured in GitLab CI/CD variables.
    - npx firebase-tools deploy --non-interactive
