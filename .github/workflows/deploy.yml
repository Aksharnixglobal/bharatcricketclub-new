name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Run every 3 hours to automatically sync latest DCL schedules
    - cron: '0 */3 * * *'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and commit back schedule updates
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.should_build.outputs.proceed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Sync latest DCL schedule
        run: npm run sync:schedule

      - name: Check for schedule changes
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain src/data/schedule.json public/data/schedule.json)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "DCL schedule changes detected."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No DCL schedule changes detected."
          fi

      - name: Determine if build and deploy are needed
        id: should_build
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding with build and deploy (Event: ${{ github.event_name }}, Changes: ${{ steps.check_changes.outputs.has_changes }})."
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Skipping build and deploy: scheduled run with no new DCL schedule changes."
          fi

      - name: Commit updated schedule if changed
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/schedule.json public/data/schedule.json
          git commit -m "chore(schedule): auto-sync latest matches from DCL [skip ci]"
          git push

      - name: Build application
        if: steps.should_build.outputs.proceed == 'true'
        run: npm run build

      - name: Upload GitHub Pages artifact
        if: steps.should_build.outputs.proceed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.proceed == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
